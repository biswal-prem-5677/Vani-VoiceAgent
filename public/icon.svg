<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#080B10" />
    </radialGradient>
    <linearGradient id="vGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer Sound Rings -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#10B981" stroke-width="3" stroke-opacity="0.25" stroke-dasharray="8 12" />
  <circle cx="256" cy="256" r="150" fill="none" stroke="#06B6D4" stroke-width="4" stroke-opacity="0.35" />
  <circle cx="256" cy="256" r="110" fill="none" stroke="#6366F1" stroke-width="5" stroke-opacity="0.45" />

  <!-- Inner Glowing Orb -->
  <circle cx="256" cy="256" r="76" fill="url(#vGrad)" opacity="0.15" filter="url(#glow)" />
  <circle cx="256" cy="256" r="64" fill="#0D111A" stroke="url(#vGrad)" stroke-width="4" />

  <!-- Waveform Bars inside Core -->
  <rect x="220" y="238" width="6" height="36" rx="3" fill="#10B981" />
  <rect x="232" y="222" width="6" height="68" rx="3" fill="#10B981" />
  <rect x="244" y="210" width="6" height="92" rx="3" fill="#06B6D4" />
  <rect x="256" y="200" width="6" height="112" rx="3" fill="#38BDF8" />
  <rect x="268" y="210" width="6" height="92" rx="3" fill="#06B6D4" />
  <rect x="280" y="222" width="6" height="68" rx="3" fill="#6366F1" />
  <rect x="292" y="238" width="6" height="36" rx="3" fill="#818CF8" />
</svg>
